specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Heartland Express
providerId: heartland-express
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Trucking
  - Transportation
  - Logistics
  - Rate Limiting
  - Quotas
  - Throttling
description: Heartland Express does not publish a public API rate-limit document. Throttling is
  governed by the shipper / 3PL agreement.
notes: No public rate-limit documentation could be located.
sources:
  - https://www.heartlandexpress.com/
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - tier: enterprise
    name: Contract-defined per-partner limit
    scope: partner
    metric: varies
    limit: see shipper / partner agreement
    applies:
      - Heartland Express API
policies:
  - name: Backoff Strategy
    description: Honor Retry-After on 429 and back off with exponential jitter on transient 5xx.
  - name: Tracking Polling Etiquette
    description: For shipment-tracking polls, prefer event/webhook delivery where available rather
      than high-frequency polling.
  - name: Partner Scoping
    description: Limits are enforced per partner credential.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
