description: 'FOCUS-aligned FinOps placeholder for Heartland Express: shipper / 3PL integration
  bundled into the broader transportation services contract. Meters describe shipment-tendering and
  tracking volume for allocation across business units.'
notes: No public commercial model is published for the API. Reconcile against the shipper agreement.
sources:
  - https://www.heartlandexpress.com/
principles:
  - name: Visibility
    description: Track API request volume and shipment events via the Heartland partner gateway
      logs; correlate with tendered loads and invoiced freight.
  - name: Allocation
    description: Allocate integration cost across shipper business units and lanes using the calling
      partner / TMS identifier.
  - name: Optimization
    description: Use webhook-driven status updates rather than high-frequency polling; batch
      tender/accept and EDI 214 status messages.
  - name: Accountability
    description: Designate a partner-integration owner per shipper; review API utilization quarterly
      against tendered-load volumes.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
