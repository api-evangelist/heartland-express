      - endpoint
  - name: loads_tendered
    description: Loads tendered to Heartland Express via the API
    unit: load
    aggregation: sum
    dimensions:
      - partner
      - lane
  - name: tracking_events
    description: Shipment status / tracking events delivered
    unit: event
    aggregation: sum
    dimensions:
      - partner
      - event_type
